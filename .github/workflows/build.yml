name: Build MeowRa1n IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid xz

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install iOS SDK
        run: |
          curl -LO https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.4.sdk.tar.xz
          tar -xf iPhoneOS16.4.sdk.tar.xz -C $HOME/theos/sdks/

      - name: Build IPA
        run: |
          export THEOS=$HOME/theos
          make package FINALPACKAGE=1 STRIP=1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeowRa1n-IPA
          path: |
            packages/*.ipa
            packages/*.deb
          if-no-files-found: warn

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "MeowRa1n v1.0.${{ github.run_number }}"
          files: |
            packages/*.ipa
            packages/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}