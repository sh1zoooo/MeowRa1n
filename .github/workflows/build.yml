name: Build MeowRa1n IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ldid xz

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install iOS 16.5 SDK
        run: |
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/theos-sdks
          echo "Available SDKs:"
          ls /tmp/theos-sdks/*.sdk 2>/dev/null || ls /tmp/theos-sdks/
          cp -r /tmp/theos-sdks/iPhoneOS16.5.sdk $HOME/theos/sdks/

      - name: Build
        run: |
          export THEOS=$HOME/theos
          make package FINALPACKAGE=1 STRIP=1 2>&1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeowRa1n-IPA
          path: |
            packages/*.ipa
            packages/*.deb
          if-no-files-found: warn

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "MeowRa1n v1.0.${{ github.run_number }}"
          files: |
            packages/*.ipa
            packages/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}