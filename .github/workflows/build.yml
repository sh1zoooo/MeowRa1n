name: Build MeowRa1n IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ldid xz dpkg

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install iOS 16.5 SDK
        run: |
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/theos-sdks
          cp -r /tmp/theos-sdks/iPhoneOS16.5.sdk $HOME/theos/sdks/

      - name: Build .deb
        run: |
          export THEOS=$HOME/theos
          make package FINALPACKAGE=1 STRIP=1 2>&1

      - name: Extract .deb and create IPA
        run: |
          DEB=$(find packages/ -name "*.deb" | head -1)
          echo "Found deb: $DEB"

          mkdir -p /tmp/deb-extract
          dpkg-deb -x "$DEB" /tmp/deb-extract

          echo "=== Contents of extracted deb ==="
          find /tmp/deb-extract -type f

          APP=$(find /tmp/deb-extract -name "*.app" -type d | head -1)
          echo "Found .app: $APP"

          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r MeowRa1n.ipa Payload/
          echo "✅ IPA size: $(du -sh MeowRa1n.ipa)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MeowRa1n-IPA
          path: |
            MeowRa1n.ipa
            packages/*.deb
          if-no-files-found: warn

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "MeowRa1n v1.0.${{ github.run_number }}"
          body: "iOS 17.4 – 26.2 Beta 1 jailbreak demo"
          files: |
            MeowRa1n.ipa
            packages/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}