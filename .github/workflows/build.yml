name: Build MeowRa1n IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ldid xz

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install iOS 16.5 SDK
        run: |
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/theos-sdks
          cp -r /tmp/theos-sdks/iPhoneOS16.5.sdk $HOME/theos/sdks/

      - name: Build
        run: |
          export THEOS=$HOME/theos
          make package FINALPACKAGE=1 STRIP=1 2>&1

      - name: Package as IPA
        run: |
          echo "=== Build output ==="
          find . -name "*.app" -o -name "*.deb" -o -name "*.ipa" 2>/dev/null | grep -v ".git"
          
          # Theos кладёт .app в .theos/obj/
          APP=$(find . -name "MeowRa1n.app" | head -1)
          if [ -n "$APP" ]; then
            mkdir -p Payload
            cp -r "$APP" Payload/
            zip -r MeowRa1n.ipa Payload/
            echo "✅ IPA created: MeowRa1n.ipa"
          else
            echo "⚠️ .app not found, listing all build artifacts:"
            find . -name "*.deb" | head -10
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeowRa1n-IPA
          path: |
            MeowRa1n.ipa
            packages/*.deb
          if-no-files-found: warn

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "MeowRa1n v1.0.${{ github.run_number }}"
          body: "iOS 17.4 – 26.2 Beta 1 jailbreak demo"
          files: |
            MeowRa1n.ipa
            packages/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}